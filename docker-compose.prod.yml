# Deploy de produção (servidor Linux)
# Uso: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: dietas-db-prod
    environment:
      POSTGRES_USER: dietas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure uma senha exclusiva para o banco}
      POSTGRES_DB: dietas
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dietas"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: dietas-backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://dietas:${POSTGRES_PASSWORD:?Configure uma senha exclusiva para o banco}@db:5432/dietas
      JWT_SECRET: ${JWT_SECRET:?Configure um segredo JWT exclusivo de pelo menos 32 caracteres}
      ADMIN_INICIAL_SENHA: ${ADMIN_INICIAL_SENHA:-}
      URL_PUBLICA: ${URL_PUBLICA:-}
      URL_RECEBIMENTO_PUBLICA: ${URL_RECEBIMENTO_PUBLICA:-}
      # Somente o nginx publica portas; ele substitui os cabeçalhos recebidos.
      FORWARDED_ALLOW_IPS: "*"
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1"]'
      BACKUP_RELATORIO_ARQUIVO: /var/lib/cnutri-monitoramento/ultimo_resultado.json
    volumes:
      # Apenas o resultado agregado; os dumps do banco não são montados na API.
      - ./work/recuperacao:/var/lib/cnutri-monitoramento:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dietas-frontend
    ports:
      - "${CNUTRI_PORTA_HTTP:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
